    <script>
      (function () {
        var section = document.getElementById('pg015-match')
        if (!section || section.dataset.adtInitialized === 'true') return
        section.dataset.adtInitialized = 'true'

        var boxes = Array.from(section.querySelectorAll('.match-box'))
        var pageStatus = section.querySelector('[data-match-status]')
        var retryButton = section.querySelector('[data-retry-button]')

        function setFeedback(el, ok) {
          if (!el) return
          el.classList.remove('show-correct', 'show-incorrect')
          el.classList.add(ok ? 'show-correct' : 'show-incorrect')
          el.innerHTML = ok
            ? '<i class="fas fa-check-circle" aria-hidden="true"></i>'
            : '<i class="fas fa-times-circle" aria-hidden="true"></i>'
          el.setAttribute('aria-label', ok ? 'சரி' : 'இணைக்கப்படவில்லை')
        }
        function clearFeedback(el) {
          if (!el) return
          el.classList.remove('show-correct', 'show-incorrect')
          el.innerHTML = ''
          el.removeAttribute('aria-label')
        }

        function initBox(box) {
          var svg = box.querySelector('.match-lines')
          var items = Array.from(box.querySelectorAll('.match-item'))
          var hint = box.querySelector('[data-match-hint]')
          var links = {}
          var selected = null
          var dragFrom = null
          var tempLine = null

          function itemById(id) {
            return items.find(function (i) { return i.dataset.matchId === id })
          }
          function imageContentRect(img) {
            var box = img.getBoundingClientRect()
            var nw = img.naturalWidth, nh = img.naturalHeight
            if (!nw || !nh) return box
            var boxRatio = box.width / box.height
            var imgRatio = nw / nh
            var w, h
            if (imgRatio > boxRatio) {
              w = box.width
              h = w / imgRatio
            } else {
              h = box.height
              w = h * imgRatio
            }
            var left = box.left + (box.width - w) / 2
            var top = box.top + (box.height - h) / 2
            return { left: left, top: top, right: left + w, bottom: top + h, width: w, height: h }
          }

          function center(item) {
            var img = item.querySelector('img')
            var r = img ? imageContentRect(img) : item.getBoundingClientRect()
            var svgRect = svg.getBoundingClientRect()
            var x = item.dataset.matchSide === 'left' ? r.right : r.left
            return { x: x - svgRect.left, y: r.top + r.height / 2 - svgRect.top }
          }
          function resizeSvg() {
            var r = svg.getBoundingClientRect()
            svg.setAttribute('width', r.width)
            svg.setAttribute('height', r.height)
            svg.setAttribute('viewBox', '0 0 ' + r.width + ' ' + r.height)
          }
          function lineEl(id) {
            var el = document.createElementNS('http://www.w3.org/2000/svg', 'line')
            el.setAttribute('data-line-for', id)
            el.setAttribute('stroke', '#0369a1')
            el.setAttribute('stroke-width', '3')
            el.setAttribute('stroke-linecap', 'round')
            return el
          }
          function redraw() {
            resizeSvg()
            Array.from(svg.querySelectorAll('line[data-line-for]')).forEach(function (l) { l.remove() })
            Object.keys(links).forEach(function (leftId) {
              var item = itemById(leftId)
              if (!item || item.dataset.matchSide !== 'left') return
              var rightId = links[leftId]
              var rightItem = itemById(rightId)
              if (!rightItem) return
              var a = center(item)
              var b = center(rightItem)
              var line = lineEl(leftId)
              line.setAttribute('x1', a.x)
              line.setAttribute('y1', a.y)
              line.setAttribute('x2', b.x)
              line.setAttribute('y2', b.y)
              svg.appendChild(line)
            })
          }

          function clearConnectionOf(id) {
            var other = links[id]
            if (other) {
              delete links[other]
              delete links[id]
            }
          }

          function connect(aId, bId) {
            var a = itemById(aId)
            var b = itemById(bId)
            if (!a || !b || a.dataset.matchSide === b.dataset.matchSide) return
            clearConnectionOf(aId)
            clearConnectionOf(bId)
            links[aId] = bId
            links[bId] = aId
            items.forEach(function (item) { clearFeedback(item.querySelector('.activity-feedback-icon')) })
            redraw()
            if (hint) hint.textContent = ''
          }

          function setSelected(item) {
            if (selected) selected.classList.remove('is-selected')
            selected = item
            if (item) item.classList.add('is-selected')
          }

          function handleActivate(item) {
            if (!selected) {
              setSelected(item)
              return
            }
            if (selected === item) {
              setSelected(null)
              return
            }
            if (selected.dataset.matchSide === item.dataset.matchSide) {
              setSelected(item)
              return
            }
            connect(selected.dataset.matchId, item.dataset.matchId)
            setSelected(null)
          }


          var pointerId = null
          var startPoint = null
          items.forEach(function (item) {
            item.addEventListener('click', function (event) {
              if (event.detail === 0 && !dragFrom) handleActivate(item)
            })
            item.addEventListener('keydown', function (event) {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault(); handleActivate(item)
              }
            })
            item.addEventListener('pointerdown', function (event) {
              if (pointerId !== null || event.button !== 0) return
              pointerId = event.pointerId; dragFrom = item
              startPoint = {x:event.clientX, y:event.clientY}
              item.focus({preventScroll:true}); item.setPointerCapture(pointerId)
              resizeSvg()
              tempLine = lineEl('__temp__'); tempLine.setAttribute('stroke-dasharray','6 4')
              var start = center(item)
              tempLine.setAttribute('x1', start.x); tempLine.setAttribute('y1', start.y)
              tempLine.setAttribute('x2', start.x); tempLine.setAttribute('y2', start.y)
              svg.appendChild(tempLine); event.preventDefault()
            })
          })
          document.addEventListener('pointermove', function (event) {
            if (!dragFrom || event.pointerId !== pointerId || !tempLine) return
            var rect = svg.getBoundingClientRect()
            tempLine.setAttribute('x2',event.clientX-rect.left)
            tempLine.setAttribute('y2',event.clientY-rect.top)
          })
          function stopDrag() {
            if (tempLine) {tempLine.remove(); tempLine=null}
            var from=dragFrom, id=pointerId
            dragFrom=null; pointerId=null; startPoint=null
            if (from && from.hasPointerCapture(id)) from.releasePointerCapture(id)
          }
          document.addEventListener('pointerup', function (event) {
            if (!dragFrom || event.pointerId !== pointerId) return
            var from=dragFrom
            var distance=Math.hypot(event.clientX-startPoint.x,event.clientY-startPoint.y)
            var hit=document.elementFromPoint(event.clientX,event.clientY)
            var target=hit ? hit.closest('.match-item') : null
            stopDrag()
            if (distance<8) handleActivate(from)
            else if(target && target!==from && box.contains(target)) {
              connect(from.dataset.matchId,target.dataset.matchId); setSelected(null)
            }
          })
          document.addEventListener('pointercancel', function (event) {
            if (event.pointerId===pointerId) stopDrag()
          })

          window.addEventListener('resize', redraw)

          Array.from(box.querySelectorAll('img')).forEach(function (img) {
            if (img.complete) return
            img.addEventListener('load', redraw)
          })
          window.addEventListener('load', redraw)

          return {
            box: box,
            items: items,
            getLinks: function () { return links },
            resetLinks: function () {
              links = {}
              setSelected(null)
              redraw()
            },
            redraw: redraw,
          }
        }

        var boxCtrls = boxes.map(initBox)

        var registerActivity = function (handlers) {
          if (typeof window.adtRegisterCustomActivity === 'function') {
            window.adtRegisterCustomActivity(section, handlers)
            return
          }
          var attempts = 0
          var timer = setInterval(function () {
            attempts++
            if (typeof window.adtRegisterCustomActivity === 'function') {
              clearInterval(timer)
              window.adtRegisterCustomActivity(section, handlers)
            } else if (attempts >= 20) {
              clearInterval(timer)
            }
          }, 100)
        }

        function resetActivity() {
          boxCtrls.forEach(function (ctrl) {
            ctrl.resetLinks()
            ctrl.items.forEach(function (item) {
              clearFeedback(item.querySelector('.activity-feedback-icon'))
            })
            var hint = ctrl.box.querySelector('[data-match-hint]')
            if (hint) hint.textContent = ''
          })
          if (pageStatus) { pageStatus.textContent = ''; pageStatus.style.color = '' }
          if (retryButton) retryButton.classList.add('hidden')
        }

        registerActivity({
          validate: function () {
            var allDone = true
            boxCtrls.forEach(function (ctrl) {
              var links = ctrl.getLinks()
              var hint = ctrl.box.querySelector('[data-match-hint]')
              var unconnected = 0
              ctrl.items.forEach(function (item) {
                var connected = !!links[item.dataset.matchId]
                setFeedback(item.querySelector('.activity-feedback-icon'), connected)
                if (!connected) unconnected++
              })
              if (unconnected > 0) {
                allDone = false
                if (hint) { hint.textContent = 'எல்லா உருவங்களையும் ஒன்றுடன் ஒன்றாக இணையுங்கள்.' }
              } else if (hint) {
                hint.textContent = ''
              }
            })
            if (pageStatus) {
              if (allDone) {
                pageStatus.textContent = 'சரி! எல்லா உருவங்களும் ஒன்றுடன் ஒன்றாக இணைக்கப்பட்டுள்ளன.'
                pageStatus.style.color = '#15803d'
              } else {
                pageStatus.textContent = 'எல்லா உருவங்களையும் ஒன்றுடன் ஒன்றாக இணையுங்கள்.'
                pageStatus.style.color = '#b91c1c'
              }
            }
            if (retryButton) retryButton.classList.toggle('hidden', allDone)
            return allDone
          },
          reset: resetActivity,
        })

        if (retryButton) {
          retryButton.addEventListener('click', function () {
            resetActivity()
          })
        }
      })()
    </script>

  </section>
      </div>
    </main>
