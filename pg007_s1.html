  <script>
    (function () {
      const section = document.currentScript.closest('section');
      if (!section || section.dataset.adtInitialized === 'true') return;
      section.dataset.adtInitialized = 'true';

      const items = Array.prototype.slice.call(section.querySelectorAll('[data-activity-item]'));
      const targets = Array.prototype.slice.call(section.querySelectorAll('[data-activity-target]'));
      const itemsSource = section.querySelector('.items-source');
      const status = section.querySelector('[data-activity-status]');
      let selectedItem = null;

      const clearPlaceholderIfNeeded = function (zone) {
        const placeholder = zone.querySelector('p');
        if (placeholder && zone.querySelector('[data-activity-item]')) placeholder.classList.add('hidden');
        if (placeholder && !zone.querySelector('[data-activity-item]')) placeholder.classList.remove('hidden');
      };

      const updatePlaceholders = function () {
        targets.forEach(function (target) {
          clearPlaceholderIfNeeded(target.querySelector('.drop-zone'));
        });
      };

      const clearSelected = function () {
        if (selectedItem) {
          selectedItem.classList.remove('ring-4', 'ring-blue-400', 'bg-blue-50');
          selectedItem.setAttribute('aria-pressed', 'false');
        }
        selectedItem = null;
      };

      const setSelected = function (item) {
        clearSelected();
        selectedItem = item;
        selectedItem.classList.add('ring-4', 'ring-blue-400', 'bg-blue-50');
        selectedItem.setAttribute('aria-pressed', 'true');
        if (status) {
          status.textContent = 'தெரிவு செய்யப்பட்டது. இப்போது பொருத்தமான கூடையைத் தெரிவு செய்யுங்கள்.';
          status.classList.remove('text-green-700', 'text-rose-700');
          status.classList.add('text-blue-700');
        }
      };

      const placeSelectedInto = function (target) {
        if (!selectedItem) return;
        clearItemFeedback(selectedItem); target.querySelector('.drop-zone').appendChild(selectedItem);
        clearSelected();
        updatePlaceholders();
        if (status) {
          status.textContent = 'கூடையில் வைக்கப்பட்டது. அனைத்தையும் வைத்த பின் விடையைச் சரிபாருங்கள்.';
          status.classList.remove('text-green-700', 'text-rose-700', 'text-blue-700');
          status.classList.add('text-stone-800');
        }
      };

      const focusSibling = function (list, current, direction) {
        const index = list.indexOf(current);
        if (index === -1) return;
        const nextIndex = (index + direction + list.length) % list.length;
        list[nextIndex].focus();
      };

      const clearItemFeedback = function (item) {
        item.classList.remove('border-green-500', 'border-rose-500', 'border-4');
        item.classList.add('border-2', 'border-gray-200');
        const old = item.querySelector('.activity-feedback-icon');
        if (old) old.remove();
      };

      const setItemFeedback = function (item, ok) {
        clearItemFeedback(item);
        item.classList.remove('border-gray-200', 'border-2');
        item.classList.add('border-4', ok ? 'border-green-500' : 'border-rose-500');
        const icon = document.createElement('span');
        const itemNumber = items.indexOf(item) + 29;
        icon.className = 'activity-feedback-icon mt-2 inline-flex min-h-7 min-w-7 items-center justify-center rounded-full text-lg font-bold ' + (ok ? 'bg-green-100 text-green-700' : 'bg-rose-100 text-rose-700');
        icon.setAttribute('aria-label', ok ? 'சரி' : 'மீண்டும் முயற்சி செய்யுங்கள்');
        icon.setAttribute('data-id', 'text-pg007-' + itemNumber);
        icon.textContent = ok ? '✓' : '✗';
        item.appendChild(icon);
      };

      items.forEach(function (item) {
        item.setAttribute('aria-pressed', 'false');
        item.addEventListener('dragstart', function (event) {
          event.dataTransfer.setData('text/plain', item.dataset.activityItem);
          item.classList.add('opacity-60');
        });
        item.addEventListener('dragend', function () {
          item.classList.remove('opacity-60');
        });
        item.addEventListener('click', function (event) { event.stopPropagation(); const basket = item.closest('[data-activity-target]'); if (selectedItem && selectedItem !== item && basket) { placeSelectedInto(basket); return; }
          if (selectedItem === item) clearSelected(); else setSelected(item);
        });
        item.addEventListener('keydown', function (event) { event.stopPropagation();
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            if (selectedItem === item) clearSelected(); else setSelected(item);
          }
          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
            event.preventDefault();
            focusSibling(items, item, 1);
          }
          if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
            event.preventDefault();
            focusSibling(items, item, -1);
          }
        });
      });

      targets.forEach(function (target) {
        const zone = target.querySelector('.drop-zone');
        target.addEventListener('dragover', function (event) {
          event.preventDefault();
          zone.classList.add('ring-4', 'ring-blue-300');
        });
        target.addEventListener('dragleave', function () {
          zone.classList.remove('ring-4', 'ring-blue-300');
        });
        target.addEventListener('drop', function (event) {
          event.preventDefault();
          zone.classList.remove('ring-4', 'ring-blue-300');
          const id = event.dataTransfer.getData('text/plain');
          const dragged = section.querySelector('[data-activity-item="' + id + '"]');
          if (dragged) {
            clearItemFeedback(dragged); clearSelected(); zone.appendChild(dragged);
            updatePlaceholders();
          }
        });
        target.addEventListener('click', function () {
          placeSelectedInto(target);
        });
        target.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            placeSelectedInto(target);
          }
          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
            event.preventDefault();
            focusSibling(targets, target, 1);
          }
          if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
            event.preventDefault();
            focusSibling(targets, target, -1);
          }
        });
      });

      window.adtRegisterCustomActivity(section, {
        validate: function () {
          let correctCount = 0;
          let placedCount = 0;
          let allCorrect = true;
          targets.forEach(function (target) {
            const correctItems = (target.dataset.correctItems || '').split(',').map(function (name) { return name.trim(); });
            target.querySelectorAll('[data-activity-item]').forEach(function (item) {
              placedCount++;
              const ok = correctItems.indexOf(item.dataset.activityItem) !== -1;
              setItemFeedback(item, ok);
              if (ok) correctCount++; else allCorrect = false;
            });
          });
          itemsSource.querySelectorAll('[data-activity-item]').forEach(function (item) {
            clearItemFeedback(item);
          });
          const remaining = itemsSource.querySelectorAll('[data-activity-item]').length;
          const passed = remaining === 0 && placedCount === items.length && allCorrect;
          if (status) {
            status.classList.remove('text-green-700', 'text-rose-700', 'text-blue-700', 'text-stone-800');
            if (passed) {
              status.textContent = 'சரியான விடை! எல்லாக் காய்கறிகளும் பொருத்தமான கூடைகளில் உள்ளன.';
              status.classList.add('text-green-700');
            } else if (remaining > 0) {
              status.textContent = 'இன்னும் ' + remaining + ' காய்கறிகளைக் கூடைகளில் வையுங்கள்.';
              status.classList.add('text-rose-700');
            } else {
              status.textContent = 'மீண்டும் முயற்சி செய்யுங்கள். சரியாக வைக்கப்பட்ட காய்கறிகள்: ' + correctCount + '.';
              status.classList.add('text-rose-700');
            }
          }
          return passed;
        },
        reset: function () {
          clearSelected();
          items.forEach(function (item) {
            clearItemFeedback(item);
            itemsSource.appendChild(item);
          });
          updatePlaceholders();
          if (status) {
            status.textContent = '';
            status.classList.remove('text-green-700', 'text-rose-700', 'text-blue-700', 'text-stone-800');
          }
        }
      });
    })();
  </script>
