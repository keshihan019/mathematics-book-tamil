    <script>(()=>{
const section=document.getElementById('pg031-drawing');if(!section||section.dataset.ready)return;section.dataset.ready='true';
const ns='http://www.w3.org/2000/svg',boards=[...section.querySelectorAll('[data-drawing]')],status=section.querySelector('[data-drawing-status]');
const controls=boards.map(svg=>{let pointer=null,path=null,points=[],pen=false,x=500,y=120;
function position(e){const r=svg.getBoundingClientRect();return [Math.max(0,Math.min(1000,(e.clientX-r.left)/r.width*1000)),Math.max(0,Math.min(240,(e.clientY-r.top)/r.height*240))];}
function start(a,b){path=document.createElementNS(ns,'path');path.dataset.stroke='';path.setAttribute('stroke','#000000');path.setAttribute('stroke-width','3');path.setAttribute('vector-effect','non-scaling-stroke');path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');path.setAttribute('fill','none');points=[[a,b],[a+.01,b+.01]];svg.append(path);render();status.textContent='';}
function render(){path.setAttribute('d',points.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' '));}
svg.addEventListener('pointerdown',e=>{if(e.button!==0||pointer!==null)return;e.preventDefault();pointer=e.pointerId;pen=false;svg.focus({preventScroll:true});svg.setPointerCapture(pointer);const p=position(e);start(p[0],p[1]);});
svg.addEventListener('pointermove',e=>{if(pointer!==e.pointerId||!path)return;e.preventDefault();for(const sample of e.getCoalescedEvents?.()||[e])points.push(position(sample));render();});
function stop(e){if(e.pointerId!==pointer)return;if(svg.hasPointerCapture(pointer))svg.releasePointerCapture(pointer);pointer=null;path=null;}
svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);svg.addEventListener('lostpointercapture',()=>{pointer=null;path=null;});
svg.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();pen=!pen;if(pen)start(x,y);else path=null;return;}const moves={ArrowLeft:[-15,0],ArrowRight:[15,0],ArrowUp:[0,-8],ArrowDown:[0,8]};if(!moves[e.key])return;e.preventDefault();x=Math.max(0,Math.min(1000,x+moves[e.key][0]));y=Math.max(0,Math.min(240,y+moves[e.key][1]));if(pen&&path){points.push([x,y]);render();}let cursor=svg.querySelector('[data-cursor]');if(!cursor){cursor=document.createElementNS(ns,'circle');cursor.dataset.cursor='';cursor.setAttribute('r','4');cursor.setAttribute('fill','#000000');svg.append(cursor);}cursor.setAttribute('cx',x);cursor.setAttribute('cy',y);});
svg.addEventListener('blur',()=>{pen=false;if(pointer===null)path=null;svg.querySelector('[data-cursor]')?.remove();});
return {reset(){if(pointer!==null&&svg.hasPointerCapture(pointer))svg.releasePointerCapture(pointer);pointer=null;path=null;pen=false;svg.replaceChildren();svg.parentElement.style.borderColor='';}};
});
window.adtRegisterCustomActivity(section,{reset(){controls.forEach(c=>c.reset());status.textContent='';},validate(){let all=true;boards.forEach(svg=>{const filled=!!svg.querySelector('[data-stroke]');all=all&&filled;svg.parentElement.style.borderColor=filled?'#15803d':'#b91c1c';});status.textContent=all?'✓ உங்கள் படங்கள் சமர்ப்பிக்கப்பட்டன.':'ஐந்து பெட்டிகளிலும் வரையுங்கள்.';status.style.color=all?'#15803d':'#b91c1c';return all;}});
})();</script></section>
