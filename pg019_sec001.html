  <script>(function(){
 const section=document.querySelector('[data-section-id="pg019_sec001"]');
 if(!section || section.dataset.instantFeedbackReady)return;

 const correct={"item-1":true,"item-2":false,"item-3":false,"item-4":true,"item-5":false,"item-6":false,"item-7":false,"item-8":true,"item-9":false};
 function update(row,animate){
  const chosen=row.querySelector('input:checked');
  const status=row.closest('[data-section-id]').querySelector('#pg019-feedback-'+row.dataset.pictureRow);
  row.querySelectorAll('label').forEach(label=>{
   const input=label.querySelector('input'),badge=label.querySelector('[data-instant-badge]'),border=label.querySelector('[data-selection-border]');

   badge.style.display=selected?'flex':'none';badge.hidden=!selected;
   badge.textContent=ok?'✓':'✕';badge.style.backgroundColor=ok?'#15803d':'#b91c1c';
   border.style.borderColor=selected?(ok?'#15803d':'#b91c1c'):'';
   if(selected && animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    badge.animate([{transform:'scale(.65)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:250});
   }
  });
  if(!chosen){status.textContent='';status.style.backgroundColor='';return;}

 }

})();</script></section>
