          var groups = Array.from(box.querySelectorAll('.match-group'))
          var hint = box.querySelector('[data-match-hint]')
          var moreInput = box.querySelector('[data-handwriting-canvas]')
          var moreFeedback = box.querySelector('[data-more-feedback]')
          var correctMoreSide = box.dataset.moreSide
          var requiresCircle = box.dataset.requiresCircle !== 'false'

          var links = {}
          var selected = null
          var dragFrom = null
          var tempLine = null
          var circledSide = null
          // Freehand circle-drawing state (stage 2 only).
          var freehandPoints = []
          var freehandActive = false
          var freehandPath = null
          var usedFreehand = false
          // The circle step is locked until the learner correctly answers
          // "how many pairs did you match?" — matches the two-stage pattern
          // used elsewhere (pick, then a follow-up step that unlocks on a
          // correct first answer).
          var pairCountConfirmed = false

          function itemById(id) {
            return items.find(function (i) { return i.dataset.matchId === id })
          }
          function center(item) {
            var r = item.getBoundingClientRect()
            var boxRect = box.getBoundingClientRect()
            var x = item.dataset.matchSide === 'left' ? r.right : r.left
            return { x: x - boxRect.left, y: r.top + r.height / 2 - boxRect.top }
          }
          function resizeSvg() {
            var r = box.getBoundingClientRect()
            svg.setAttribute('width', r.width)
            svg.setAttribute('height', r.height)
            svg.setAttribute('viewBox', '0 0 ' + r.width + ' ' + r.height)
          }
          function lineEl(id) {
            var el = document.createElementNS('http://www.w3.org/2000/svg', 'line')
            el.setAttribute('data-line-for', id)
            el.setAttribute('stroke', '#0369a1')
            el.setAttribute('stroke-width', '3')
            el.setAttribute('stroke-linecap', 'round')
            return el
          }
          // No auto-generated ellipse anymore — the only way to mark the
          // bigger group is an actual pencil-drag circle (see the freehand
          // handlers below). This just clears any stray leftover ellipse.
          function drawCircle() {
            var existing = svg.querySelector('ellipse[data-circle]')
            if (existing) existing.remove()
          }
          function redraw() {
            resizeSvg()
            Array.from(svg.querySelectorAll('line[data-line-for]')).forEach(function (l) { l.remove() })
            Object.keys(links).forEach(function (leftId) {
              var item = itemById(leftId)
              if (!item || item.dataset.matchSide !== 'left') return
              var rightId = links[leftId]
              var rightItem = itemById(rightId)
              if (!rightItem) return
              var a = center(item)
              var b = center(rightItem)
              var line = lineEl(leftId)
              line.setAttribute('x1', a.x)
              line.setAttribute('y1', a.y)
              line.setAttribute('x2', b.x)
              line.setAttribute('y2', b.y)
              svg.appendChild(line)
            })
            drawCircle()
          }

          function clearConnectionOf(id) {
            var other = links[id]
            if (other) { delete links[other]; delete links[id] }
          }
          function connect(aId, bId) {
            var a = itemById(aId)
            var b = itemById(bId)
            if (!a || !b || a.dataset.matchSide === b.dataset.matchSide) return
            clearConnectionOf(aId)
            clearConnectionOf(bId)
            links[aId] = bId
            links[bId] = aId
            redraw()
            if (hint) hint.textContent = ''
          }
          function setSelected(item) {
            if (selected) selected.classList.remove('is-selected')
            selected = item
            if (item) item.classList.add('is-selected')
          }
          function handleActivate(item) {
            if (!selected) { setSelected(item); return }
            if (selected === item) { setSelected(null); return }
            if (selected.dataset.matchSide === item.dataset.matchSide) { setSelected(item); return }
            connect(selected.dataset.matchId, item.dataset.matchId)
            setSelected(null)
          }

          var pointerId = null
          var startPoint = null
          items.forEach(function (item) {
            item.addEventListener('click', function (event) {
              event.stopPropagation(); if (event.detail === 0 && !dragFrom) handleActivate(item)
            })
            item.addEventListener('keydown', function (event) {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault(); event.stopPropagation(); handleActivate(item)
              }
            })
            item.addEventListener('pointerdown', function (event) {
              if (pointerId !== null || event.button !== 0) return
              event.stopPropagation(); pointerId = event.pointerId; dragFrom = item
              startPoint = {x:event.clientX, y:event.clientY}
              item.focus({preventScroll:true}); item.setPointerCapture(pointerId)
              resizeSvg()
              tempLine = lineEl('__temp__'); tempLine.setAttribute('stroke-dasharray','6 4')
              var start = center(item)
              tempLine.setAttribute('x1', start.x); tempLine.setAttribute('y1', start.y)
              tempLine.setAttribute('x2', start.x); tempLine.setAttribute('y2', start.y)
              svg.appendChild(tempLine); event.preventDefault()
            })
          })
          document.addEventListener('pointermove', function (event) {
            if (!dragFrom || event.pointerId !== pointerId || !tempLine) return
            var rect = svg.getBoundingClientRect()
            tempLine.setAttribute('x2',event.clientX-rect.left)
            tempLine.setAttribute('y2',event.clientY-rect.top)
          })
          function stopDrag() {
            if (tempLine) {tempLine.remove(); tempLine=null}
            var from=dragFrom, id=pointerId
            dragFrom=null; pointerId=null; startPoint=null
            if (from && from.hasPointerCapture(id)) from.releasePointerCapture(id)
          }
          document.addEventListener('pointerup', function (event) {
            if (!dragFrom || event.pointerId !== pointerId) return
            var from=dragFrom
            var distance=Math.hypot(event.clientX-startPoint.x,event.clientY-startPoint.y)
            var hit=document.elementFromPoint(event.clientX,event.clientY)
            var target=hit ? hit.closest('.match-item') : null
            stopDrag()
            if (distance<8) handleActivate(from)
            else if(target && target!==from && box.contains(target)) {
              connect(from.dataset.matchId,target.dataset.matchId); setSelected(null)
            }
          })
          document.addEventListener('pointercancel', function (event) {
            if (event.pointerId===pointerId) stopDrag()
          })

          // Circle-the-bigger-group selection — locked until the pair-count
          // answer is confirmed correct (see validate()). Two input paths:
          // No click/keyboard "auto-circle" anymore — the only way to mark
          // the bigger group is an actual pencil-drag circle (below).
          // Clicking/activating a group by keyboard just surfaces the
          // instruction; it never sets circledSide itself.
          function promptToDraw() {
            if (!pairCountConfirmed) {
              if (hint) hint.textContent = 'முதலில் இணைத்த சோடிகளின் எண்ணிக்கையை எழுதி, "சமர்ப்பிக்கவும்" பொத்தானை அழுத்துங்கள்.'
            } else if (hint) {
              hint.textContent = 'உருவங்களைச் சுற்றி இழுத்து வட்டம் வரையுங்கள்.'
            }
          }
          if (requiresCircle) {
            groups.forEach(function (g) {
              g.setAttribute('aria-pressed', 'false')
              g.classList.add('circle-locked')
              g.addEventListener('click', promptToDraw)
              g.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault()
                  promptToDraw()
                }
              })
            })
          } else {
            // This box doesn't need the circle step at all — the group
            // wrappers exist in the markup for layout only, so make sure
            // they're not left as dead, non-functional focus stops.
            groups.forEach(function (g) {
              g.removeAttribute('role')
              g.removeAttribute('tabindex')
            })
          }

          // Freehand pencil-drag circling. Starts only on empty box space
          // (a pointerdown that started on a .match-item already called
          // stopPropagation, so it never reaches here) and only once stage 2
          // is unlocked.
          function boxPoint(e) {
            var r = box.getBoundingClientRect()
            return { x: e.clientX - r.left, y: e.clientY - r.top }
          }
          function itemCenterInBox(item) {
            var r = item.getBoundingClientRect()
            var boxRect = box.getBoundingClientRect()
            return { x: r.left + r.width / 2 - boxRect.left, y: r.top + r.height / 2 - boxRect.top }
          }
          function renderFreehand() {
            if (!freehandPath) {
              freehandPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
              freehandPath.setAttribute('data-freehand', 'true')
              freehandPath.setAttribute('fill', 'none')
              freehandPath.setAttribute('stroke', '#dc2626')
              freehandPath.setAttribute('stroke-width', '4')
              freehandPath.setAttribute('stroke-linecap', 'round')
              freehandPath.setAttribute('stroke-linejoin', 'round')
              svg.appendChild(freehandPath)
            }
            var d = freehandPoints.map(function (p, i) { return (i === 0 ? 'M' : 'L') + p.x + ',' + p.y }).join(' ')
            freehandPath.setAttribute('d', d)
          }
          box.addEventListener('pointerdown', function (e) {
            if (!requiresCircle) return
            if (!pairCountConfirmed) return
            if (e.target.closest('.match-item')) return
            var existingEllipse = svg.querySelector('ellipse[data-circle]')
            if (existingEllipse) existingEllipse.remove()
            if (freehandPath) { freehandPath.remove(); freehandPath = null }
            freehandActive = true
            freehandPoints = [boxPoint(e)]
          })
          box.addEventListener('pointermove', function (e) {
            if (!freehandActive) return
            freehandPoints.push(boxPoint(e))
            renderFreehand()
          })
          function finishFreehand() {
            if (!freehandActive) return
            freehandActive = false
            var totalDist = 0
            for (var i = 1; i < freehandPoints.length; i++) {
              var dx = freehandPoints[i].x - freehandPoints[i - 1].x
              var dy = freehandPoints[i].y - freehandPoints[i - 1].y
              totalDist += Math.sqrt(dx * dx + dy * dy)
            }
            // A tap or tiny wobble isn't a circling attempt — discard it
            // quietly rather than scoring it as a wrong answer.
            if (totalDist < 40 || freehandPoints.length < 4) {
              if (freehandPath) { freehandPath.remove(); freehandPath = null }
              return
            }
            var xs = freehandPoints.map(function (p) { return p.x })
            var ys = freehandPoints.map(function (p) { return p.y })
            var minX = Math.min.apply(null, xs)
            var maxX = Math.max.apply(null, xs)
            var minY = Math.min.apply(null, ys)
            var maxY = Math.max.apply(null, ys)
            function scoreFor(side) {
              var sideItems = items.filter(function (i) { return i.dataset.matchSide === side })
              var inside = 0
              sideItems.forEach(function (it) {
                var c = itemCenterInBox(it)
                if (c.x >= minX && c.x <= maxX && c.y >= minY && c.y <= maxY) inside++
              })
              return sideItems.length ? inside / sideItems.length : 0
            }
            var leftScore = scoreFor('left')
            var rightScore = scoreFor('right')
            var chosen = null
            if (leftScore >= 0.5 && leftScore > rightScore) chosen = 'left'
            else if (rightScore >= 0.5 && rightScore > leftScore) chosen = 'right'
            if (chosen) {
              usedFreehand = true
              circledSide = chosen
              groups.forEach(function (g) {
                g.setAttribute('aria-pressed', g.dataset.groupSide === circledSide ? 'true' : 'false')
              })
              if (hint) hint.textContent = ''
            } else {
              if (freehandPath) { freehandPath.remove(); freehandPath = null }
              if (hint) hint.textContent = 'உருவங்களைச் சுற்றித் தெளிவாக வட்டம் வரையுங்கள்.'
            }
          }
          box.addEventListener('pointerup', finishFreehand)
          box.addEventListener('pointercancel', function () {
            freehandActive = false
            if (freehandPath) { freehandPath.remove(); freehandPath = null }
          })

          window.addEventListener('resize', redraw)

          return {
            box: box,
            items: items,
            groups: groups,
            moreInput: moreInput,
            moreFeedback: moreFeedback,
            correctMoreSide: correctMoreSide,
            requiresCircle: requiresCircle,
            getLinks: function () { return links },
            getCircledSide: function () { return circledSide },
            isPairCountConfirmed: function () { return pairCountConfirmed },
            confirmPairCount: function () {
              pairCountConfirmed = true
              if (requiresCircle) box.style.touchAction = 'none'
              groups.forEach(function (g) { g.classList.remove('circle-locked') })
            },
            leftCount: items.filter(function (i) { return i.dataset.matchSide === 'left' }).length,
            rightCount: items.filter(function (i) { return i.dataset.matchSide === 'right' }).length,
            resetAll: function () {
              links = {}
              circledSide = null
              pairCountConfirmed = false
              box.style.touchAction = ''
              usedFreehand = false
              freehandActive = false
              freehandPoints = []
              if (freehandPath) { freehandPath.remove(); freehandPath = null }
              setSelected(null)
              groups.forEach(function (g) {
                g.setAttribute('aria-pressed', 'false')
                g.classList.add('circle-locked')
                g.style.outline = ''
              })
              if (moreInput) moreInput.dispatchEvent(new Event('handwriting-reset'))
              if (moreFeedback) clearFeedback(moreFeedback)
              redraw()
            },
            redraw: redraw,
          }
        }

        var boxCtrls = boxes.map(initBox)

        var registerActivity = function (handlers) {
          if (typeof window.adtRegisterCustomActivity === 'function') {
            window.adtRegisterCustomActivity(section, handlers)
            return
          }
          var attempts = 0
          var timer = setInterval(function () {
            attempts++
            if (typeof window.adtRegisterCustomActivity === 'function') {
              clearInterval(timer)
              window.adtRegisterCustomActivity(section, handlers)
            } else if (attempts >= 20) {
              clearInterval(timer)
            }
          }, 100)
        }

        function resetActivity() {
          boxCtrls.forEach(function (ctrl) {
            ctrl.resetAll()
            ctrl.items.forEach(function (item) { clearFeedback(item.querySelector('.activity-feedback-icon')) })
            var hint = ctrl.box.querySelector('[data-match-hint]')
            if (hint) hint.textContent = ''
          })
          if (pageStatus) { pageStatus.textContent = ''; pageStatus.style.color = '' }
          if (retryButton) retryButton.classList.add('hidden')
        }

        registerActivity({
          // Two stages per box, each gating the next:
          //   1. Connect all matchable pairs, then answer "how many pairs?"
          //      correctly — this is REQUIRED before the circle step unlocks.
          //   2. Once unlocked, circle the group with more items.
          // A box only counts as done once both stages are correct; a
          // wrong pair-count answer keeps the circle step locked and shows
          // the retry button, same as a wrong circle choice would.
          // Submission accepts any visible handwriting in each count box.
          // Matching and circling remain optional practice; no numeral recognition.
          validate: function () {
            var complete = boxCtrls.every(function (ctrl) {
              var canvas = ctrl.moreInput;
              if (!canvas) return false;
              var pixels = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
              for (var i = 3; i < pixels.length; i += 4) if (pixels[i] > 0) return true;
              return false;
            });
            if (pageStatus) {
              pageStatus.textContent = complete ? 'எழுதிய விடைகள் சமர்ப்பிக்கப்பட்டன.' : 'இரண்டு பெட்டிகளிலும் எண்ணை எழுதுங்கள்.';
              pageStatus.style.color = complete ? '#15803d' : '#b91c1c';
            }
            if (retryButton) retryButton.classList.add('hidden');
            return complete;
          },
          reset: resetActivity,
        })

        if (retryButton) {
          retryButton.addEventListener('click', function () { resetActivity() })
        }
      })()
    </script>

  <script>
(function () {
  var initialized = new WeakSet();
  function initialize() {
    document.querySelectorAll('[data-handwriting]').forEach(function (section) {
      if (initialized.has(section)) return;
      var canvases = Array.from(section.querySelectorAll('[data-handwriting-canvas]'));
      if (!canvases.length) return;
      initialized.add(section);
      var states = canvases.map(function (canvas) {
        var ctx = canvas.getContext('2d');
        var state = { canvas: canvas, pointer: null, last: null, length: 0, pen: false, x: canvas.width / 2, y: canvas.height / 2 };
        function blocked() { return document.body.dataset.linkMode === 'true'; }
        function point(event) {
          var r = canvas.getBoundingClientRect();
          return { x: (event.clientX - r.left) * canvas.width / r.width, y: (event.clientY - r.top) * canvas.height / r.height };

          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          state.length += Math.hypot(b.x - a.x, b.y - a.y);

        }
        function stop() { state.pointer = null; state.last = null; }
        canvas.addEventListener('pointerdown', function (event) {
          if (blocked() || event.button !== 0 || state.pointer !== null) return;
          event.preventDefault(); canvas.focus();
          state.pointer = event.pointerId; state.last = point(event);
          canvas.setPointerCapture(event.pointerId);
        });
        canvas.addEventListener('pointermove', function (event) {
          if (blocked()) { stop(); return; }
          if (state.pointer !== event.pointerId || !state.last) return;
          event.preventDefault();
          var next = point(event); line(state.last, next); state.last = next;
        });
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (type) {
          canvas.addEventListener(type, function (event) { if (state.pointer === event.pointerId) stop(); });
        });
        state.clear = function () { stop(); state.pen = false; state.length = 0; delete canvas.dataset.handwritingLength; if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height); };
        canvas.addEventListener('handwriting-reset', state.clear);
        canvas.addEventListener('keydown', function (event) {
          if (blocked()) return;
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); state.pen = !state.pen; return; }
          if (event.key === 'Escape') { state.pen = false; return; }
          if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); state.clear(); return; }

          if (state.pen) line({ x: state.x, y: state.y }, next);

          validate: function () { return states.every(function (state) { return state.length >= 30; }); },
