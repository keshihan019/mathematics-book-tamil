d="false" class="min-h-11 rounded-lg border-2 border-slate-300 bg-white px-3 py-2 focus-visible:ring-4 focus-visible:ring-sky-500 aria-pressed:bg-sky-100 aria-pressed:border-sky-700 min-w-11"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#16a34a"/></svg></button><button type="button" data-color="#2563eb" aria-label="&#xba8;&#xbc0;&#xbb2;&#xbae;&#xbcd;" aria-pressed="false" class="min-h-11 rounded-lg border-2 border-slate-300 bg-white px-3 py-2 focus-visible:ring-4 focus-visible:ring-sky-500 aria-pressed:bg-sky-100 aria-pressed:border-sky-700 min-w-11"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2563eb"/></svg></button><button type="button" data-color="#9333ea" aria-label="&#xb8a;&#xba4;&#xbbe;" aria-pressed="false" class="min-h-11 rounded-lg border-2 border-slate-300 bg-white px-3 py-2 focus-visible:ring-4 focus-visible:ring-sky-500 aria-pressed:bg-sky-100 aria-pressed:border-sky-700 min-w-11"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#9333ea"/></svg></button><button type="button" data-color="#db2777" aria-label="&#xb87;&#xbb3;&#xb9e;&#xbcd;&#xb9a;&#xbbf;&#xbb5;&#xbaa;&#xbcd;&#xbaa;&#xbc1;" aria-pressed="false" class="min-h-11 rounded-lg border-2 border-slate-300 bg-white px-3 py-2 focus-visible:ring-4 focus-visible:ring-sky-500 aria-pressed:bg-sky-100 aria-pressed:border-sky-700 min-w-11"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#db2777"/></svg></button><button type="button" data-color="#92400e" aria-label="&#xbaa;&#xbb4;&#xbc1;&#xbaa;&#xbcd;&#xbaa;&#xbc1;" aria-pressed="false" class="min-h-11 rounded-lg border-2 border-slate-300 bg-white px-3 py-2 focus-visible:ring-4 focus-visible:ring-sky-500 aria-pressed:bg-sky-100 aria-pressed:border-sky-700 min-w-11"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><ci <script>(function drawingRuntime(){
  const root=document.getElementById('pg012-drawing');
  if(!root||root.dataset.initialized)return;root.dataset.initialized='true';
  const canvas=root.querySelector('canvas');const ctx=canvas.getContext('2d');
  const status=root.querySelector('[data-status]');
  let color='#111827',size=6,erase=false,active=null,pointer=null;
  const strokes=[];let redo=[];
  function segment(stroke,a,b){
    ctx.globalCompositeOperation=stroke.erase?'destination-out':'source-over';
    ctx.strokeStyle=stroke.color;ctx.fillStyle=stroke.color;ctx.lineWidth=stroke.size;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    if(a.x===b.x&&a.y===b.y){ctx.beginPath();ctx.arc(a.x,a.y,stroke.size/2,0,Math.PI*2);ctx.fill();}
  }
  function render(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of strokes){segment(s,s.points[0],s.points[0]);for(let i=1;i<s.points.length;i++)segment(s,s.points[i-1],s.points[i]);}ctx.globalCompositeOperation='source-over';}
  function point(event){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(canvas.width,(event.clientX-r.left)*canvas.width/r.width)),y:Math.max(0,Math.min(canvas.height,(event.clientY-r.top)*canvas.height/r.height))};}
  function finish(){if(!active)return;strokes.push(active);active=null;pointer=null;redo=[];}
  function start(p){active={color,size:size*(erase?4:1),erase,points:[p]};segment(active,p,p);status.textContent='';}
  canvas.addEventListener('pointerdown',event=>{if(pointer!==null||event.button!==0)return;event.preventDefault();canvas.focus({preventScroll:true});pointer=event.pointerId;canvas.setPointerCapture(pointer);start(point(event));});
  canvas.addEventListener('pointermove',event=>{if(!active||pointer!==event.pointerId)return;event.preventDefault();const events=event.getCoalescedEvents?.()||[];for(const e of events.length?events:[event]){const p=point(e);segment(active,active.points.at(-1),p);active.points.push(p);}});
  function end(event){if(pointer!==event.pointerId)return;finish();if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);}
  canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',()=>finish());
  const cursor={x:800,y:500};let keyboardDrawing=false;
  canvas.addEventListener('keydown',event=>{
    if(event.key===' '||event.key==='Enter'){event.preventDefault();if(pointer!==null)return;if(keyboardDrawing){finish();keyboardDrawing=false;}else{start({...cursor});keyboardDrawing=true;}return;}
    const delta={ArrowLeft:[-15,0],ArrowRight:[15,0],ArrowUp:[0,-15],ArrowDown:[0,15]}[event.key];
    if(!delta||pointer!==null)return;event.preventDefault();cursor.x=Math.max(0,Math.min(canvas.width,cursor.x+delta[0]));cursor.y=Math.max(0,Math.min(canvas.height,cursor.y+delta[1]));if(keyboardDrawing&&active){const p={...cursor};segment(active,active.points.at(-1),p);active.points.push(p);}
  });
  canvas.addEventListener('blur',()=>{if(keyboardDrawing){finish();keyboardDrawing=false;}});
  function tool(value){erase=value;root.querySelector('[data-brush]').setAttribute('aria-pressed',String(!erase));root.querySelector('[data-eraser]').setAttribute('aria-pressed',String(erase));}
  root.querySelectorAll('[data-color]').forEach(button=>button.addEventListener('click',()=>{finish();color=button.dataset.color;tool(false);root.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
  root.querySelector('[data-brush]').addEventListener('click',()=>{finish();tool(false);});
  root.querySelector('[data-eraser]').addEventListener('click',()=>{finish();tool(true);});
  root.querySelector('[data-size]').addEventListener('change',event=>{finish();size=Number(event.target.value);});
  root.querySelector('[data-undo]')?.addEventListener('click',()=>{finish();if(strokes.length)redo.push(strokes.pop());render();status.textContent='';});
  root.querySelector('[data-redo]')?.addEventListener('click',()=>{if(redo.length)strokes.push(redo.pop());render();status.textContent='';});
  root.querySelector('[data-clear]')?.addEventListener('click',()=>{finish();if(strokes.length){redo=strokes.splice(0).reverse();render();}status.textContent='';});
  const handlers={validate(){finish();keyboardDrawing=false;const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;let ink=false;for(let i=3;i<pixels.length;i+=4){if(pixels[i]>0){ink=true;break;}}status.textContent=ink?'உங்கள் ஓவியம் சமர்ப்பிக்கப்பட்டது. பெரிய உருவத்தையும் சிறிய உருவத்தையும் ஆசிரியரிடம் காட்டுங்கள்.':'முதலில் பெரிய உருவமொன்றையும் சிறிய உருவமொன்றையும் வரையுங்கள்.';return ink;},reset(){active=null;pointer=null;keyboardDrawing=false;strokes.length=0;redo=[];render();status.textContent='';}};
  if(typeof window.adtRegisterCustomActivity==='function')window.adtRegisterCustomActivity(root,handlers);else(window.__adtPendingCustomActivities=window.__adtPendingCustomActivities||[]).push({section:root,handlers});
})();</script></section>
