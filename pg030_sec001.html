  <script>(()=>{
const section=document.getElementById('pg030-matching');if(!section||section.dataset.ready)return;section.dataset.ready='true';
const board=section.querySelector('[data-match-board]'),svg=board.querySelector('svg'),buttons=[...board.querySelectorAll('button')],status=section.querySelector('[data-match-status]'),correct=[3,1,5,2,4];let links={},selected=null,graded=false;
function get(side,index){return buttons.find(b=>b.dataset.matchSide===side&&Number(b.dataset.matchIndex)===index);}
function draw(){const bounds=board.getBoundingClientRect();svg.setAttribute('viewBox','0 0 '+bounds.width+' '+bounds.height);svg.replaceChildren();buttons.forEach(b=>{b.style.borderColor=b===selected?'#0284c7':'#22c55e';b.setAttribute('aria-pressed',String(b===selected));b.querySelector('[data-match-badge]').textContent='';});
Object.entries(links).forEach(([picture,number])=>{const p=get('picture',Number(picture)),n=get('number',number),a=p.getBoundingClientRect(),b=n.getBoundingClientRect();const good=correct[Number(picture)]===number+1,colour=graded?(good?'#15803d':'#b91c1c'):'#0284c7';const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.dataset.connection=picture;line.setAttribute('x1',b.right-bounds.left);line.setAttribute('y1',b.top+b.height/2-bounds.top);line.setAttribute('x2',a.left-bounds.left);line.setAttribute('y2',a.top+a.height/2-bounds.top);line.setAttribute('stroke',colour);line.setAttribute('stroke-width','3');svg.append(line);[p,n].forEach(item=>{item.style.borderColor=colour;if(graded){const badge=item.querySelector('[data-match-badge]');badge.textContent=good?'✓':'✕';badge.style.color=colour;}});});}
buttons.forEach(button=>button.addEventListener('click',()=>{if(!selected||selected.dataset.matchSide===button.dataset.matchSide){selected=selected===button?null:button;draw();return;}const picture=Number((button.dataset.matchSide==='picture'?button:selected).dataset.matchIndex),number=Number((button.dataset.matchSide==='number'?button:selected).dataset.matchIndex);Object.keys(links).forEach(key=>{if(links[key]===number)delete links[key];});links[picture]=number;selected=null;graded=false;status.textContent='';draw();}));
function reset(){links={};selected=null;graded=false;status.textContent='';draw();}
section.querySelector('[data-match-reset]').addEventListener('click',reset);
new ResizeObserver(draw).observe(board);board.querySelectorAll('img').forEach(img=>img.addEventListener('load',draw));
window.adtRegisterCustomActivity(section,{reset,validate(){graded=true;selected=null;draw();const ok=correct.every((count,i)=>links[i]===count-1);status.textContent=ok?'✓ சரி! எல்லாப் பொருத்தங்களும் சரி.':'உருவங்களை எண்ணி, பொருத்தமான எண்ணுடன் இணையுங்கள்.';status.style.color=ok?'#15803d':'#b91c1c';return ok;}});draw();
})();</script></section>
