bc8;&#xb95;&#xbc0;&#xbb4;&#xbbe;&#xba9; &#xbaa;&#xb9a;&#xbcd;&#xb9a;&#xbc8; &#xbae;&#xbc1;&#xb95;&#xbcd;&#xb95;&#xbcb;&#xba3;&#xbae;&#xbcd;" class="block w-full h-auto" draggable="false" style="max-width: 100%; height: auto;"><button type="button" data-drop class="absolute rounded-md border-2 border-dashed border-transparent focus-visible:border-sky-600" style="left: 53.75%; top: 2.56%; width: 15.42%; height: 94.87%;" aria-label="&#xbb5;&#xbb0;&#xbbf;&#xb9a;&#xbc8; 5: &#xb85;&#xb9f;&#xbc1;&#xba4;&#xbcd;&#xba4; &#xb89;&#xbb0;&#xbc1;&#xbb5;&#xba4;&#xbcd;&#xba4;&#xbbf;&#xbb1;&#xbcd;&#xb95;&#xbbe;&#xba9; &#xb87;&#xb9f;&#xbae;&#xbcd;"></button><button type="button" data-choice="0" class="touch-none absolute rounded-md border-2 border-transparent hover:border-sky-400 focus-visible:border-sky-600" style="left: 71.98391420911528%; top: 2.56%; width: 13.672922252010725%; height: 94.87%;" aria-label="&#xba4;&#xbb2;&#xbc8;&#xb95;&#xbc0;&#xbb4;&#xbbe;&#xba9; &#xbaa;&#xb9a;&#xbcd;&#xb9a;&#xbc8; &#xbae;&#xbc1;&#xb95;&#xbcd;&#xb95;&#xbcb;&#xba3;&#xbae;&#xbcd;" aria-pressed="false"><img data-id="pg024_triangle_choice_0_1790151757631" src="images/pg024_triangle_choice_0_1790151757631.png" alt="&#xba4;&#xbb2;&#xbc8;&#xb95;&#xbc0;&#xbb4;&#xbbe;&#xba9; &#xbaa;&#xb9a;&#xbcd;&#xb9a;&#xbc8; &#xbae;&#xbc1;&#xb95;&#xbcd;&#xb95;&#xbcb;&#xba3;&#xbae;&#xbcd;" draggable="false" class="hidden" style="max-width: 100%; height: auto;"></button><button type="button" data-choice="1" class="touch-none absolute rounded-md border-2 border-transparent hover:border-sky-400 focus-visible:border-sky-600" style="left: 85.656836461126%; top: 2.56%; width: 13.672922252010725%; height: 94.87%;" aria-label="&#xba8;&#xbc0;&#xbb2; &#xbae;&#xbc1;&#xb95;&#xbcd;&#xb95;&#xbcb;&#xba3;&#xbae;&#xbcd;" aria-pressed="false"><img data-id="pg024_triangle_choice_1_1790151757641" src="images/pg024_triangle_choice_1_1790151757641.png" alt="&#xba8;&#xbc0;&#xbb2; &#xbae;&#xbc1;&#xb95;&#xbcd;&#xb95;&#xbcb;&#xba3;&#xbae;&#xbcd;" draggable="false" class="hidden" style="max-width: 100%; height: auto;"></button></div></div><p data-pattern-status class="mt-4 min-h-8 font-bold" role="status" aria-live="polite"></p><button type="button" data-pattern-reset class="mt-2 min-h-11 rounded-lg border-2 border-sky-500 px-4 py-2">&#xbae;&#xbc0;&#xba3;&#xbcd;&#xb9f;&#xbc1;&#xbae;&#xbcd; &#xbae;&#xbc1;&#xbaf;&#xbb1;&#xbcd;&#xb9a;&#xbbf; &#xb9a;&#xbc6;&#xbaf;&#xbcd;&#xbaf;&#xbc1;&#xb99;&#xbcd;&#xb95;&#xbb3;&#xbcd;</button><script>(()=>{
const section=document.getElementById('pg024-pattern');if(!section||section.dataset.ready)return;section.dataset.ready='true';
const rows=[...section.querySelectorAll('[data-pattern-row]')],answers=rows.map(()=>null),status=section.querySelector('[data-pattern-status]');
let active=null,ghost=null;
function place(row,choice){const index=Number(row.dataset.patternRow),button=row.querySelector('[data-choice="'+choice+'"]'),drop=row.querySelector('[data-drop]');answers[index]=choice;
 const img=button.querySelector('img').cloneNode(true);img.removeAttribute('data-id');img.className='h-full w-full object-contain bg-white';drop.replaceChildren(img);drop.style.borderColor='#0284c7';drop.style.backgroundColor='white';
 drop.setAttribute('aria-label','வரிசை '+(index+1)+': '+img.alt);row.querySelectorAll('[data-choice]').forEach(b=>{const yes=Number(b.dataset.choice)===choice;b.setAttribute('aria-pressed',String(yes));b.style.borderColor=yes?'#0284c7':'';});status.textContent='';
}
function end(){if(active){const b=active.button;if(b.hasPointerCapture(active.id))b.releasePointerCapture(active.id);}active=null;if(ghost)ghost.remove();ghost=null;}
rows.forEach(row=>{
row.querySelectorAll('[data-choice]').forEach(button=>{
 button.addEventListener('click',e=>{if(e.detail===0)place(row,Number(button.dataset.choice));});
 button.addEventListener('pointerdown',e=>{if(e.button!==0||active)return;active={row,button,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};button.focus({preventScroll:true});button.setPointerCapture(e.pointerId);e.preventDefault();});
});
row.querySelector('[data-drop]').addEventListener('keydown',e=>{if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();clear(row);}});
});
document.addEventListener('pointermove',e=>{if(!active||active.id!==e.pointerId)return;if(Math.hypot(e.clientX-active.x,e.clientY-active.y)>8)active.moved=true;if(!active.moved)return;
 if(!ghost){ghost=active.button.querySelector('img').cloneNode(true);ghost.removeAttribute('data-id');ghost.className='';ghost.style.cssText='position:fixed;width:64px;height:80px;object-fit:contain;pointer-events:none;z-index:9999;background:white;opacity:.85;';document.body.append(ghost);}
 ghost.style.left=(e.clientX-32)+'px';ghost.style.top=(e.clientY-40)+'px';active.row.querySelector('[data-drop]').style.borderColor='#0284c7';
});
document.addEventListener('pointerup',e=>{if(!active||active.id!==e.pointerId)return;const a=active,hit=document.elementFromPoint(e.clientX,e.clientY),drop=hit?.closest('[data-drop]');if(!a.moved||(drop&&a.row.contains(drop)))place(a.row,Number(a.button.dataset.choice));else if(answers[Number(a.row.dataset.patternRow)]===null)a.row.querySelector('[data-drop]').style.borderColor='';end();});
document.addEventListener('pointercancel',e=>{if(active?.id===e.pointerId){const row=active.row;if(answers[Number(row.dataset.patternRow)]===null)row.querySelector('[data-drop]').style.borderColor='';end();}});
function clear(row){answers[Number(row.dataset.patternRow)]=null;const drop=row.querySelector('[data-drop]');drop.replaceChildren();drop.style.borderColor='';drop.style.backgroundColor='';drop.setAttribute('aria-label','வரிசை '+(Number(row.dataset.patternRow)+1)+': அடுத்த உருவத்திற்கான இடம்');row.querySelectorAll('[data-choice]').forEach(b=>{b.setAttribute('aria-pressed','false');b.style.borderColor='';});status.textContent='';}
function reset(){end();rows.forEach(clear);}
section.querySelector('[data-pattern-reset]').addEventListener('click',reset);
window.adtRegisterCustomActivity(section,{reset,validate(){let ok=true;rows.forEach((row,i)=>{const correct=answers[i]===1;ok=ok&&correct;const drop=row.querySelector('[data-drop]');drop.querySelector('[data-result]')?.remove();drop.style.borderColor=correct?'#15803d':'#b91c1c';const badge=document.createElement('span');badge.dataset.result='';badge.textContent=correct?'✓':'✕';badge.style.cssText='position:absolute;right:0;top:0;border-radius:50%;background:'+(correct?'#15803d':'#b91c1c')+';color:white;width:24px;height:24px;font-weight:bold;';drop.append(badge);});status.textContent=ok?'✓ சரி!':'✕ ஒவ்வொரு வரிசையிலும் அடுத்து வரும் உருவத்தைத் தெரிவு செய்யுங்கள்.';status.style.color=ok?'#15803d':'#b91c1c';return ok;}});
})();</script></section>
