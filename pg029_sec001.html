  <script>(()=>{
const section=document.getElementById('pg029-count');if(!section||section.dataset.ready)return;section.dataset.ready='true';const counts=Array.from({length:5},()=>[]),status=section.querySelector('[data-count-status]');
section.querySelectorAll('[data-count-piece]').forEach(button=>button.addEventListener('click',()=>{const row=Number(button.dataset.row),piece=Number(button.dataset.countPiece),list=counts[row],at=list.indexOf(piece);if(at<0)list.push(piece);else list.splice(at,1);
section.querySelectorAll('[data-count-row="'+row+'"] button').forEach(b=>{const index=list.indexOf(Number(b.dataset.countPiece)),selected=index>=0;b.setAttribute('aria-pressed',String(selected));b.style.borderColor=selected?'#0284c7':'';const badge=b.querySelector('[data-count-badge]');badge.textContent=selected?String(index+1):'';badge.style.display=selected?'flex':'none';});
status.textContent='வரிசை '+(row+1)+': '+list.length+' / '+(row+1)+(list.length===row+1?' ✓':'');
}));
})();</script></section>
